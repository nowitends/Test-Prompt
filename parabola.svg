<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Graph of the parabola y equals x squared minus 4</title>
  <desc id="desc">An upward-opening parabola with vertex at zero comma minus four and x-intercepts at minus two and two.</desc>
  <rect width="720" height="500" rx="12" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Parabola: y = x² − 4</text>

  <!-- Plot bounds: x from -3.5 to 3.5 and y from -5 to 5. -->
  <g stroke="#e5e7eb" stroke-width="1">
    <path d="M110 60V420 M180 60V420 M250 60V420 M320 60V420 M390 60V420 M460 60V420 M530 60V420 M600 60V420"/>
    <path d="M110 60H600 M110 96H600 M110 132H600 M110 168H600 M110 204H600 M110 240H600 M110 276H600 M110 312H600 M110 348H600 M110 384H600 M110 420H600"/>
  </g>
  <g stroke="#374151" stroke-width="2">
    <path d="M110 240H600"/>
    <path d="M355 60V420"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#4b5563">
    <text x="110" y="264" text-anchor="middle">−3.5</text>
    <text x="215" y="264" text-anchor="middle">−2</text>
    <text x="285" y="264" text-anchor="middle">−1</text>
    <text x="355" y="264" text-anchor="middle">0</text>
    <text x="425" y="264" text-anchor="middle">1</text>
    <text x="495" y="264" text-anchor="middle">2</text>
    <text x="600" y="264" text-anchor="middle">3.5</text>
    <text x="343" y="425" text-anchor="end">−5</text>
    <text x="343" y="353" text-anchor="end">−3</text>
    <text x="343" y="281" text-anchor="end">−1</text>
    <text x="343" y="209" text-anchor="end">1</text>
    <text x="343" y="137" text-anchor="end">3</text>
    <text x="343" y="65" text-anchor="end">5</text>
    <text x="611" y="245" font-style="italic">x</text>
    <text x="365" y="72" font-style="italic">y</text>
  </g>

  <path d="M145 60 Q355 708 565 60" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <g fill="#dc2626" stroke="#ffffff" stroke-width="2">
    <circle cx="215" cy="240" r="7"/>
    <circle cx="495" cy="240" r="7"/>
    <circle cx="355" cy="384" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937">
    <text x="198" y="224" text-anchor="end">(−2, 0)</text>
    <text x="512" y="224">(2, 0)</text>
    <text x="370" y="401">(0, −4) vertex</text>
  </g>
</svg>
